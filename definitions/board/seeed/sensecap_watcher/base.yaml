---
esp32:
  flash_size: 32MB
  cpu_frequency: 240MHZ
  framework:
    advanced:
      # Required for OTA with 32MB flash since 2026.8
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

esphome:
  platformio_options:
    board_build.flash_mode: qio
  on_boot:
    - priority: 600
      then:
        #- output.turn_on: pin_power_sdcard
        # - output.turn_on: pin_power_lcd
        # - output.turn_on: pin_power_codec_pa
        # - output.turn_on: pin_power_bat_adc
        # - output.turn_on: pin_power_system
        - lvgl.widget.hide: boot_screen
        #- output.turn_on: pin_power_aichip
        #- output.turn_on: pin_power_grove
        
packages:
  base: !include ../../../base.yaml
  extended: !include ../../../extended.yaml

uart:
  - id: uart_0
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200

logger:
  hardware_uart: UART0

i2c:
  - id: i2c_0
    scl: GPIO48
    sda: GPIO47
    frequency: 400kHz
    setup_priority: 1000

  - id: i2c_1
    scl: GPIO38
    sda: GPIO39
    frequency: 400kHz
    setup_priority: 950

spi:
  - id: spi_2
    clk_pin: GPIO4
    mosi_pin: GPIO5
    miso_pin: GPIO6
    
  - id: spi_3
    clk_pin: GPIO7
    type: quad
    data_pins:
      - GPIO9
      - GPIO1
      - GPIO14
      - GPIO13

tca9555:
  - id: io_expander
    i2c_id: i2c_0

