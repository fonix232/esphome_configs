time:
  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    i2c_id: i2c_0
    update_interval: never
  - id: !extend homeassistant_time
    on_time_sync:
      then:
        pcf8563.write_time:
          id: pcf8563_time

sensor:
  - id: rotary_0
    platform: rotary_encoder
    name: "Rotary Encoder"
    pin_a: GPIO41
    pin_b: GPIO42
    on_clockwise: 
      then:
        lvgl.page.next:
    on_anticlockwise: 
      then:
        lvgl.page.previous:
  - platform: adc
    pin: 
      number: GPIO3
      ignore_strapping_warning: true
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 2.5db
    update_interval: 1s
    accuracy_decimals: 4
    filters:
      - multiply: 4.1  # Adjust based on voltage divider (see note below)
    unit_of_measurement: "V"

binary_sensor:
  - id: rotary_button
    platform: gpio
    pin:
      tca9555: io_expander
      number: 3
      inverted: true
    name: "Rotary Encoder Button"
    on_press:
      - voice_assistant.start:
          silence_detection: false
    on_release:
      - voice_assistant.stop:


light:
  - id: led_0
    platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO40
    num_leds: 1
    chipset: ws2812
    name: "RGB LED"



micro_wake_word:
  id: micro_wake_word_0
  microphone:
    microphone: mic_0
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json@main
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json@main


