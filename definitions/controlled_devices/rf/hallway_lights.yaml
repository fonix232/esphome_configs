---
packages:
  hallway_lights_codes: !include _hallway_lights.codes.yaml

light:
  - platform: binary
    id: hallway_light
    name: "Hallway RGB Light"
    output: hallway_light_output
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - platform: template
    id: hallway_light_output
    type: binary
    write_action:
      - lambda: |-
          if (state) {
            ESP_LOGI("rf_light", "Light turned ON");
            if (!id(skip_rf_transmit)) {
              // Send ON RF code
            }
          } else {
            ESP_LOGI("rf_light", "Light turned OFF");
            if (!id(skip_rf_transmit)) {
              // Send OFF RF code
            }
          }

remote_receiver:
  - id: !extend cc1101_receiver
    on_rc_switch:
      - then:
          - lambda: 'ESP_LOGI("rf_light", "Remote receiver triggered: code=%llu (0x%llx)", x.code, x.code);'
          - lambda: id(skip_rf_transmit) = true;
          # - script.execute:
          #     id: handle_rf_code
          #     code: !lambda 'return x.code;'
          - delay: 100ms
          - lambda: id(skip_rf_transmit) = false;
          - lambda: 'ESP_LOGI("rf_light", "Remote receiver handling complete");'
