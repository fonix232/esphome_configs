---
packages:
  lcars: !include lcars_theme.yaml
  lcars_font_small: !include
    file: lcars_font.yaml
    vars:
      font_size: 12
      font_weight: 100
      font_name: lcars_font_small
  lcars_font_medium: !include
    file: lcars_font.yaml
    vars:
      font_size: 18
      font_weight: 100
      font_name: lcars_font_medium
  lcars_font_large: !include
    file: lcars_font.yaml
    vars:
      font_size: 32
      font_weight: 100
      font_name: lcars_font_large

display:
  - id: !extend main_display
    lambda: |-
      it.rectangle(0,  0, it.get_width(), it.get_height(), id(lcars_gold));
      it.rectangle(0, 20, it.get_width(), it.get_height(), id(lcars_gold));   // header bar

      it.print(5, 10, id(lcars_font_small), id(lcars_text), TextAlign::CENTER_LEFT,  App.get_name().c_str());

      if (id(system_status).state) {
        it.print(it.get_width() * 0.9, 10, id(lcars_font_small), id(lcars_green), TextAlign::CENTER_RIGHT, "Online");
        it.filled_circle(it.get_width() * 0.95, 10, 4.5, id(lcars_green));
      }
      else {
        it.print(it.get_width() * 0.9, 10, id(lcars_font_small), id(lcars_mars), TextAlign::CENTER_RIGHT, "Offline");
        it.filled_circle(it.get_width() * 0.95, 10, 4.5, id(lcars_mars));
      }

      it.strftime((it.get_width() / 2), (it.get_height() / 3) * 1 + 5, id(lcars_font_medium), id(lcars_text), TextAlign::CENTER, "%Y-%m-%d", id(esptime).now());
      it.strftime((it.get_width() / 2), (it.get_height() / 3) * 2 + 5, id(lcars_font_large), id(lcars_text), TextAlign::CENTER, "%H:%M:%S", id(esptime).now());