---
# Display/touch wiring for the fogOS UI on the Tab5.
#
# Rotation is done by LVGL (PPA-accelerated on the P4), so the display and
# touch are overridden back to native portrait here and LVGL rotates both
# rendering and touch input. Touch also wakes the display from idle dimming
# (the 5-minute dim itself is lvgl on_idle, which lives in the main file).
display:
  - id: !extend main_display
    rotation: 0°
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - id: !extend main_touch
    transform:
      swap_xy: false
      mirror_x: false
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    on_touch:
      - if:
          condition:
            lambda: return id(display_dimmed);
          then:
            - light.turn_on:
                id: backlight
                brightness: 100%
            - globals.set:
                id: display_dimmed
                value: 'false'

globals:
  - id: display_dimmed
    type: bool
    initial_value: 'false'
