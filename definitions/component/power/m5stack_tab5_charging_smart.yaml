---
# M5Stack Tab5 charge policy over the self-calibrating battery model.
#
# Hardware, via the 0x44 IO expander:
#   P7 CHG_EN      high = charging allowed
#   P5 nCHG_QC_EN  active low = 1A quick charge, high = 0.5A standard
#   P6 CHG_STAT    input, asserted while the charger is pushing current
#
# The pack spends nearly all its life on mains, so calendar ageing dominates
# and the ceiling is effectively the pack's storage state of charge rather than
# a usable-reserve figure. Smart mode therefore parks it well short of full;
# 70% is the default, 60% would be closer to the storage optimum if the smaller
# reserve is acceptable.
#
# There is deliberately no periodic automatic full charge. The usual "calibrate
# every three months" advice exists for coulomb-counting gauges, which
# accumulate integration error and need full-charge and full-discharge flags to
# re-anchor. This estimator is a voltage lookup with nothing to drift, and the
# one thing a full charge would teach it — the charger's CV setpoint — is a
# hardware constant, so a single observation lasts the life of the device. On a
# board that runs from its input rather than the pack, a scheduled full charge
# would also leave the pack sitting at 100% until the next power cut, which is
# the condition the ceiling exists to avoid.
packages:
  battery: !include m5stack_tab5_battery_model.yaml

globals:
  # Survives a reboot so a full charge interrupted by an OTA still finishes
  - id: charge_to_full_once
    type: bool
    initial_value: "false"
    restore_value: true

  - id: charge_to_full_started
    type: uint32_t
    initial_value: "0"
    restore_value: false
  # Consecutive evaluations that looked like charge termination
  - id: charge_taper_count
    type: int
    initial_value: "0"
    restore_value: false
  - id: batt_rest_last_ms
    type: uint32_t
    initial_value: "0"
    restore_value: false
  - id: batt_rest_v_before
    type: float
    initial_value: "NAN"
    restore_value: false
  - id: batt_rest_i_before
    type: float
    initial_value: "NAN"
    restore_value: false
  - id: batt_temp_hold
    type: bool
    initial_value: "false"
    restore_value: false

switch:
  - platform: gpio
    id: charge_enable
    name: "Charging Enabled"
    entity_category: config
    icon: "mdi:battery-charging"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    # On by default, so a flat pack recovers even if nothing else runs
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    entity_category: config
    icon: "mdi:battery-charging-high"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: charger_active
    name: "Charger Active"
    device_class: battery_charging
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    on_state:
      - script.execute: charge_control

  - platform: template
    id: external_power
    name: "External Power"
    device_class: plug
    lambda: |-
      if (std::isnan(id(battery_current).state)) {
        return {};
      }
      return id(battery_current).state < 0.05f;

select:
  - platform: template
    id: charge_mode
    name: "Charge Mode"
    entity_category: config
    icon: "mdi:battery-heart-variant"
    optimistic: true
    restore_value: true
    initial_option: "Smart"
    options:
      # Hold the pack between the resume and target levels
      - "Smart"
      # Charge to 100% and keep it there
      - "Full"
      # Leave both switches alone — control them yourself
      - "Manual"
      # No charging at all, including the low-voltage rescue
      - "Off"
    on_value:
      - script.execute: charge_control

number:
  - platform: template
    id: charge_target
    name: "Charge Target"
    entity_category: config
    icon: "mdi:battery-charging-70"
    unit_of_measurement: "%"
    min_value: 40
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - script.execute: charge_control

  - platform: template
    id: charge_resume
    name: "Charge Resume Below"
    entity_category: config
    icon: "mdi:battery-charging-20"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 60
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - script.execute: charge_control

  - platform: template
    id: quick_charge_below
    name: "Quick Charge Below"
    entity_category: config
    icon: "mdi:battery-charging-high"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 40
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - script.execute: charge_control

  # Die temperature, which idles around 44-50°C on this board — this is a
  # backstop against charging a genuinely hot device, not a pack sensor
  - platform: template
    id: charge_temp_limit
    name: "Charge Temperature Limit"
    entity_category: config
    icon: "mdi:thermometer-alert"
    unit_of_measurement: "°C"
    min_value: 45
    max_value: 80
    step: 1
    initial_value: 55
    optimistic: true
    restore_value: true
    mode: box

button:
  # The only path to a full charge, and the one that pins the full-charge
  # voltage the model needs
  - platform: template
    name: "Charge to Full Once"
    id: charge_to_full_button
    icon: "mdi:battery-charging-100"
    on_press:
      - lambda: |-
          id(charge_to_full_once) = true;
          id(charge_to_full_started) = millis();
          id(charge_taper_count) = 0;
          ESP_LOGI("tab5.charge", "charging to full once, ceiling bypassed");
      - script.execute: charge_control

  - platform: template
    name: "Reset Battery Calibration"
    id: reset_battery_calibration
    entity_category: config
    icon: "mdi:backup-restore"
    on_press:
      - lambda: |-
          id(batt_v_full) = ${battery_v_full_default};
          id(batt_v_empty) = ${battery_v_empty_default};
          id(batt_r_internal) = ${battery_r_internal_default};
          id(batt_full_learned) = false;
          id(batt_empty_learned) = false;
          ESP_LOGI("tab5.charge", "battery calibration reset to defaults");

text_sensor:
  - platform: template
    id: charge_status
    name: "Charge Status"
    icon: "mdi:battery-sync"
    update_interval: never

script:
  # Pause charging briefly so the pack can be measured at rest. The current
  # step across the pause also yields the internal resistance, which is what
  # makes the IR-compensated estimate trustworthy between pauses.
  - id: battery_rest_measure
    mode: single
    then:
      - lambda: |-
          id(batt_rest_v_before) = id(battery_voltage).state;
          id(batt_rest_i_before) = id(battery_current).state;
      - switch.turn_off: charge_enable
      - text_sensor.template.publish:
          id: charge_status
          state: "Resting (measuring)"
      # Three INA226 conversions, so the reading is settled and current-free
      - delay: 15s
      - lambda: |-
          id(batt_rest_last_ms) = millis();

          const float v_after = id(battery_voltage).state;
          const float i_after = id(battery_current).state;
          const float v_before = id(batt_rest_v_before);
          const float i_before = id(batt_rest_i_before);

          if (std::isnan(v_after) || std::isnan(i_after) ||
              std::isnan(v_before) || std::isnan(i_before)) {
            return;
          }

          const float di = i_after - i_before;
          if (fabsf(di) < 0.2f) {
            return;  // too small a step to read anything from
          }

          const float r = (v_before - v_after) / di;
          if (r < 0.05f || r > 0.6f) {
            ESP_LOGW("tab5.charge", "implausible pack resistance %.3f ohm, ignored", r);
            return;
          }

          const float smoothed = 0.7f * id(batt_r_internal) + 0.3f * r;
          if (fabsf(smoothed - id(batt_r_internal)) > 0.02f) {
            ESP_LOGI("tab5.charge", "pack resistance %.3f -> %.3f ohm",
                     id(batt_r_internal), smoothed);
            id(batt_r_internal) = smoothed;
          }
      # Recompute the estimate from the rested voltage and corrected resistance
      - component.update: battery_ocv
      - component.update: battery_level
      - script.execute: charge_control

  - id: charge_control
    mode: restart
    then:
      - lambda: |-
          const float volts = id(battery_voltage).state;
          const float amps = id(battery_current).state;
          const float level = id(battery_level).state;
          const float temp = id(chip_temperature).state;
          const std::string mode = id(charge_mode).current_option();

          // Nothing sensible to do until the INA226 has reported
          if (std::isnan(volts) || std::isnan(amps)) {
            id(charge_status).publish_state("Unknown");
            return;
          }

          // Below ~5V the pack is absent or the connector is off
          if (volts < 5.0f) {
            id(charge_status).publish_state("No battery");
            return;
          }

          const bool charging_now = amps < -0.05f;
          const bool on_battery = amps > 0.05f;
          const bool have_level = !std::isnan(level);

          // A charge-to-full that never terminates must not strand the pack at
          // 100%, so the request expires on its own
          if (id(charge_to_full_once) &&
              (millis() - id(charge_to_full_started)) > 6UL * 3600UL * 1000UL) {
            ESP_LOGW("tab5.charge", "charge-to-full expired without termination");
            id(charge_to_full_once) = false;
          }
          const bool to_full = (mode == "Full") || id(charge_to_full_once);

          // --- learning ------------------------------------------------------
          // Termination is the one moment the pack is both full and unloaded,
          // so the voltage then is the charger's CV setpoint
          const bool terminating = id(charge_enable).state && !on_battery &&
                                   (!id(charger_active).state || fabsf(amps) < 0.06f);
          if (to_full && terminating) {
            id(charge_taper_count)++;
          } else {
            id(charge_taper_count) = 0;
          }
          if (id(charge_taper_count) >= 3) {
            id(charge_taper_count) = 0;
            if (volts >= 7.8f && volts <= 8.5f) {
              if (fabsf(volts - id(batt_v_full)) > 0.03f) {
                ESP_LOGI("tab5.charge", "full-charge voltage %.3f -> %.3f V",
                         id(batt_v_full), volts);
                id(batt_v_full) = volts;
              }
              id(batt_full_learned) = true;
            } else {
              ESP_LOGW("tab5.charge", "termination at implausible %.3f V, not learned", volts);
            }
            id(charge_to_full_once) = false;
          }

          // The bottom of the scale is only ever an observation, never a
          // measurement — the device dies before it can record a true empty
          if (on_battery) {
            const float ocv = volts + amps * id(batt_r_internal);
            if (ocv > 5.8f && ocv < id(batt_v_empty)) {
              const float moved = id(batt_v_empty) + 0.5f * (ocv - id(batt_v_empty));
              if (fabsf(moved - id(batt_v_empty)) > 0.03f) {
                ESP_LOGI("tab5.charge", "observed minimum %.3f -> %.3f V",
                         id(batt_v_empty), moved);
                id(batt_v_empty) = moved;
                id(batt_empty_learned) = true;
              }
            }
          }

          // --- policy --------------------------------------------------------
          bool want_charge = id(charge_enable).state;
          bool want_quick = id(quick_charge).state;

          if (mode == "Off") {
            want_charge = false;
            want_quick = false;
          } else if (to_full) {
            want_charge = !(have_level && level >= 99.5f);
            want_quick = have_level && level < id(quick_charge_below).state;
          } else if (mode == "Smart") {
            float target = id(charge_target).state;
            float resume = id(charge_resume).state;
            // Keep a usable band even if the two numbers are set to overlap
            if (resume >= target) {
              resume = target - 5.0f;
            }

            if (have_level) {
              if (level >= target) {
                want_charge = false;
              } else if (level <= resume) {
                want_charge = true;
              }
              // Between the thresholds the current state holds, so the charger
              // doesn't chatter around the target
            }
            want_quick = have_level && level < id(quick_charge_below).state;
          }
          // "Manual" falls through with both switches left as the user set them

          // Trust a settled reading rather than the estimate when the decision
          // is close, since an uncompensated 100mV is ~4% of this pack
          const float decide_at = to_full ? 99.5f : id(charge_target).state;
          const bool near_decision = have_level && level >= decide_at - 5.0f;
          if (mode != "Manual" && mode != "Off" && near_decision &&
              id(charge_enable).state && charging_now &&
              (millis() - id(batt_rest_last_ms)) > 600000UL) {
            id(battery_rest_measure).execute();
            return;  // that script re-runs this once the pack has settled
          }

          // Charging a hot board is worse for the pack than any threshold
          // choice, so hold off until it drops clear of the limit
          if (!std::isnan(temp)) {
            const float limit = id(charge_temp_limit).state;
            if (temp >= limit) {
              id(batt_temp_hold) = true;
            } else if (temp <= limit - 3.0f) {
              id(batt_temp_hold) = false;
            }
          }
          if (id(batt_temp_hold) && mode != "Manual") {
            want_charge = false;
          }

          // Rescuing a deeply discharged pack outranks both the policy and the
          // temperature hold, short of charging having been turned off outright
          const bool critical = volts < 6.4f;
          if (critical && mode != "Off" && mode != "Manual") {
            want_charge = true;
            want_quick = true;
          }

          if (mode != "Manual") {
            if (want_quick != id(quick_charge).state) {
              ESP_LOGI("tab5.charge", "quick charge -> %s", want_quick ? "1A" : "0.5A");
              want_quick ? id(quick_charge).turn_on() : id(quick_charge).turn_off();
            }
            if (want_charge != id(charge_enable).state) {
              ESP_LOGI("tab5.charge", "charging -> %s (%.2fV, %.0f%%)",
                       want_charge ? "on" : "off", volts, have_level ? level : 0.0f);
              want_charge ? id(charge_enable).turn_on() : id(charge_enable).turn_off();
            }
          }

          // --- status --------------------------------------------------------
          const char *status;
          if (critical && !want_charge) {
            status = "Battery critical";
          } else if (mode == "Off") {
            status = "Disabled";
          } else if (id(batt_temp_hold) && !want_charge) {
            status = "Paused (too warm)";
          } else if (charging_now) {
            if (to_full) {
              status = "Charging to full";
            } else {
              status = id(quick_charge).state ? "Charging (1A)" : "Charging (0.5A)";
            }
          } else if (on_battery) {
            status = "Discharging";
          } else if (!id(charge_enable).state) {
            status = "Holding";
          } else if (have_level && level >= 99.0f) {
            status = "Full";
          } else {
            status = "Idle";
          }
          id(charge_status).publish_state(status);

interval:
  - interval: 30s
    then:
      - script.execute: charge_control

esphome:
  on_boot:
    # After the INA226 and the restored select/number values are up
    - priority: -100
      then:
        - lambda: |-
            // A restored full-charge request restarts its window; millis()
            // began again at zero
            if (id(charge_to_full_once)) {
              id(charge_to_full_started) = millis();
            }
        - delay: 15s
        - script.execute: charge_control
