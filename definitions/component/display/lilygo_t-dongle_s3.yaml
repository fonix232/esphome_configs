---
packages:
  display_base: !include
    file: base/ili9xxx.yaml
    vars:
      display_model: ST7735
      display_reset_pin: GPIO01
      display_dc_pin: GPIO02
      display_cs_pin: GPIO04
      display_invert_colors: True
      display_dimensions_height: 160
      display_dimensions_width: 80
      display_dimensions_offset_height: 1
      display_dimensions_offset_width: 26
  display_backlight: !include
    file: base/pwm_backlight.yaml
    vars:
      display_backlight_pin: GPIO38
      display_backlight_pin_inverted: True

spi:
  mosi_pin: 
    number: GPIO03
    ignore_strapping_warning: True
  clk_pin: GPIO05

display:
  - id: !extend main_display
    rotation: 90
    color_order: bgr