touchscreen:
  platform: cst816
  id: touchscreen_0
  display: display_0
  i2c_id: i2c_0
  interrupt_pin: GPIO4
  reset_pin:
    pca9554: pca9554a_device
    number: 1
    mode:
      output: true
    inverted: false

lvgl:
  top_layer:
    widgets:
      - button:
          id: page_prev
          x: 0
          y: 156
          width: 50
          height: 100
          widgets:
            - label:
                align: center
                text: "\uF053"
          on_press:
            then:
              lvgl.page.previous:
      - button:
          id: page_next
          x: 362
          y: 156
          width: 50
          height: 100
          widgets:
            - label:
                align: center
                text: "\uF054"
          on_press:
            then:
              lvgl.page.next:
      - button:
          id: page_home
          x: 156
          y: 362
          width: 100
          height: 50
          widgets:
            - label:
                align: center
                text: "\uF015"
          on_press:
            then:
              lvgl.page.show: main_page
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0xffffff
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            # - image:
            #     align: CENTER
            #     src: boot_logo
            #     y: -40
            - spinner:
                align: CENTER
                y: 95
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: 0x18bcf2
                  arc_width: 8
          on_press:
            - lvgl.widget.hide: boot_screen
  style_definitions:
    - id: header_footer
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      width: 100%
      height: 30
  pages:
    - id: main_page
      widgets:
        - obj:
            align: TOP_MID
            styles: header_footer
            widgets:
              - label:
                  text: "ESPHome LVGL Display"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF
    - id: second_page
      widgets:
        - obj:
            align: TOP_MID
            styles: header_footer
            widgets:
              - label:
                  text: "A second page"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF