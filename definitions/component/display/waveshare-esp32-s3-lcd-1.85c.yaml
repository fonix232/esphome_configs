---
output:
  - platform: ledc
    pin: GPIO5
    id: display_backlight_pwm

light:
  - platform: monochromatic
    output: display_backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: RESTORE_DEFAULT_ON

display:
  - id: display_0
    platform: qspi_dbi
    model: CUSTOM
    data_rate: 80MHz
    spi_id: spi_1
    dimensions:
      width: 360
      height: 360
    brightness: 255
    cs_pin: GPIO21
    enable_pin: GPIO18
    reset_pin:
      pca9554: pca9554a_device
      number: 2
      mode:
        output: true
      inverted: false
    color_order: rgb
    invert_colors: true
    draw_rounding: 4
    auto_clear_enabled: false
    update_interval: never
    init_sequence:
      - [ 0xF0, 0x28 ]
