---
# HAT Header layout:
#
# |     |  3V3   | △ | | ▼ | 5V PWR |  5V  |
# |     | PIN 3  | ○ | | ▼ | 5V PWR |  5V  |
# |     | PIN 5  | ○ | | ■ |  GND   | GND  |
# |     | PIN 7  | ○ | | ○ | PIN 8  |      |
# | GND |  GND   | ■ | | ○ | PIN 10 |      |
# | RST | PIN 11 | ● | | ○ | PIN 12 |      |
# |     | PIN 13 | ○ | | ■ |  GND   | GND  |
# |     | PIN 15 | ○ | | ○ | PIN 16 |      |
# |     |  3V3   | △ | | ● | PIN 18 | BUSY |
# | DIN | PIN 19 | ● | | ■ |  GND   |      |
# |     | PIN 21 | ○ | | ● | PIN 22 |  DC  |
# | SCK | PIN 23 | ● | | ● | PIN 24 |  CS  |
# |     |  GND   | ■ | | ○ | PIN 26 |      |
# |     |   NC   | ✕ | | ✕ |   NC   |      |
# |     | PIN 29 | ○ | | □ |  GND   |      |
# |     | PIN 31 | ○ | | ○ | PIN 32 |      |
# |     | PIN 33 | ○ | | □ |  GND   |      |
# |     | PIN 35 | ○ | | ○ | PIN 36 |      |
# |     | PIN 37 | ○ | | ○ | PIN 38 |      |
# |     |  GND   | □ | | ○ |  GND   |      |
# 
#
# Icons:
# ○ | ● - pin | in use
# △ | ▲ - 3V3
# ▽ | ▼ - 5V
# □ | ■ - GND
# ⨯ - NC

spi:
  - id: spi_bus_display
    clk_pin: ${epaper_spi_clk}
    mosi_pin: ${epaper_spi_din}

display:
  - id: main_display
    platform: epaper_spi
    model: 7.3in-spectra-e6
    cs_pin: ${epaper_spi_cs}
    dc_pin: ${epaper_spi_dc}
    busy_pin:  
      number: ${epaper_busy}
      inverted: true
    reset_pin: 
      number: ${epaper_reset}
      inverted: false
    update_interval: never
