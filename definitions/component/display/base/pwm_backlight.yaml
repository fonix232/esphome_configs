---
light:
  - platform: monochromatic
    output: display_backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - pulse:
          name: "Blinking"
          transition_length: 1s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 70%
      - pulse:
          name: "Breathing"
          transition_length: 2s
          update_interval: 3s
          min_brightness: 10%
          max_brightness: 100%