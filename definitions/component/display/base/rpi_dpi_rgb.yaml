---
display:
  - platform: rpi_dpi_rgb
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: ${display_width}
      height: ${display_height}
    de_pin:
      number: ${display_de}
    hsync_pin:
      number: ${display_hsync}
      ignore_strapping_warning: true
    vsync_pin:
      number: ${display_vsync}
      ignore_strapping_warning: true
    pclk_pin: ${display_pclk}
    reset_pin: 
      ${display_reset}
      # ch422g: ch422g_hub
      # number: 3
      # mode:
      #   output: true
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red:
        - ${display_r1}
        - ${display_r2}
        - ${display_r3}
        - ${display_r4}
        - ${display_r5}
      blue:
        - ${display_b1}
        - ${display_b2}
        - ${display_b3}
        - ${display_b4}
        - ${display_b5}
      green:
        - ${display_g1}
        - ${display_g2}
        - ${display_g3}
        - ${display_g4}
        - ${display_g5}
        - ${display_g6}

