---
spi:
  clk_pin: ${display_clk_pin}
  mosi_pin: ${display_mosi_pin}

display:
  - platform: ssd1351_spi
    model: ${display_model}
    id: main_display
    reset_pin: ${display_reset_pin}
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    data_rate: 10MHz

number:
  - platform: template
    name: "Display Backlight"
    id: back_light
    min_value: 0.0
    max_value: 100.0
    step: 1.0
    initial_value: 100.0
    entity_category: config
    device_class: illuminance
    set_action:
      then:
        - lambda: |-
            id(main_display).set_brightness(x / 100);