  display_base: !include
    file: base/mipi_spi.yaml
    vars:
      display_model: ST7789V
      display_dc_pin: GPIO8
      display_reset_pin: GPIO9
      display_cs_pin: GPIO10
      display_mosi_pin: GPIO11
      display_clk_pin: GPIO12
      display_invert_colors: True
      display_dimensions_height: 135
      display_dimensions_width: 240
      display_dimensions_offset_height: 52
      display_dimensions_offset_width: 40
  display_backlight_ledc: !include
    file: base/pwm_backlight_ledc.yaml
    vars:
      display_backlight_pin: 7
      display_backlight_pin_inverted: False
  display_backlight: !include
    file: base/pwm_backlight.yaml

spi:
  mosi_pin: 
    number: GPIO11
  clk_pin: GPIO12


display:
  - id: !extend main_display
    transform:
      swap_xy: True
      mirror_y: True
      mirror_x: False

globals:
  - id: display_rotated
    type: bool
    restore_value: yes
    initial_value: 'false'

