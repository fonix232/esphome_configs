---
# Epson RX8130 RTC. Read once at boot so the clock is right before the network
# is, and written back whenever Home Assistant syncs the time.
time:
  - platform: rx8130
    id: rtc_time
    i2c_id: ${rtc_i2c_id}
    address: 0x32
    timezone: Europe/London
    # No repeated reads — the internal clock is accurate enough between syncs
    update_interval: never
  - id: !extend homeassistant_time
    on_time_sync:
      then:
        rx8130.write_time:
          id: rtc_time

esphome:
  on_boot:
    - priority: 600
      then:
        - rx8130.read_time: rtc_time
