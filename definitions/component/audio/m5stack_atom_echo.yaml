---
packages:
  mixer_speaker: !include
    file: common/mixer_speaker.yaml
    vars:
      speaker_channels: 1
      speaker_sample_rate: 16000
      speaker_bits_per_sample: 16
  mediaplayer: !include
    file: common/mediaplayer_assistant_speaker.yaml
    vars:
      speaker_format: FLAC
      speaker_sample_rate: 16000
      speaker_volume_increment: 0.01
      speaker_volume_min: 0.3
      speaker_volume_max: 1.0
      announcement_channels: 1
      media_channels: 1

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - id: mic_0
    platform: i2s_audio
    adc_type: external
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit
    correct_dc_offset: true

speaker:
  # Original Atom Echo (ESP32-PICO) has no PSRAM — keep the mixer task stack in internal RAM
  - id: !extend speaker_mixer
    task_stack_in_psram: false
  - id: speaker_0
    platform: i2s_audio
    dac_type: external
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO22
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo  # The Echo has poor playback audio quality when using mon audio
    buffer_duration: 60ms
