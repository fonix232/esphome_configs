---
packages:
  mixer_speaker: !include
    file: common/mixer_speaker.yaml
    vars:
      speaker_channels: 1
      speaker_sample_rate: 16000
      speaker_bits_per_sample: 16
  mediaplayer: !include
    file: common/mediaplayer_assistant_speaker.yaml
    vars:
      speaker_format: FLAC
      speaker_sample_rate: 16000
      speaker_volume_increment: 0.01
      speaker_volume_min: 0.3
      speaker_volume_max: 1.0
      announcement_channels: 1
      media_channels: 1

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO15
  - id: i2s_out
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

microphone:
  - id: mic_0
    platform: i2s_audio
    adc_type: external
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO39
    channel: right
    # pdm: true
    sample_rate: 16000
    bits_per_sample: 32bit
    # correct_dc_offset: true

speaker:
  - id: speaker_0
    platform: i2s_audio
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO47
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
