---
# ST7123 — integrated display/touch controller on later Tab5 hardware.
# Also covers ST7121 units; the touch half is identical, only the display
# init sequence differs (tab5_display_model: M5STACK-TAB5-ST7121).
touchscreen:
  - platform: st7123
    id: main_touch
    i2c_id: bsp_bus
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    # Unlike the GT911, this driver finishes its init (incl. attaching the
    # interrupt) inside update() -- with `never` it stays dead forever, so it
    # must poll. The interrupt still delivers low-latency touches once attached.
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: true
    calibration:
      x_min: 0
      x_max: 1280
      y_min: 0
      y_max: 720
