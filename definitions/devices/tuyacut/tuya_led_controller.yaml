---
packages:
  board: !include ../../board/tuya/kl_wifi_spi_3key.yaml
  bt_proxy: !include ../../component/bluetooth/proxy_bk72xx.yaml

light:
  - platform: beken_spi_led_strip
    id: beken_strip
    output_id: beken_strip_out
    rgb_order: BRG
    pin: P16
    num_leds: 51
    chipset: ws2812
    name: "LED Strip"
    restore_mode: ALWAYS_ON

select:
  - id: rgb_order_select
    name: "Choose RGB order"
    platform: template
    entity_category: config
    restore_value: true
    options:
      - "RGB"
      - "RBG"
      - "GBR"
      - "GRB"
      - "BGR"
      - "BRG"
    initial_option: "BRG"
    set_action:
      then:
        - lambda: |-
            auto rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_GRB;

            if(x == "RGB") { rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_RGB; }
            if(x == "RBG") { rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_RBG; }
            if(x == "GBR") { rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_GBR; }
            if(x == "GRB") { rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_GRB; }
            if(x == "BGR") { rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_BGR; }
            if(x == "BRG") { rgb_order = esphome::beken_spi_led_strip::RGBOrder::ORDER_BRG; }

            ESP_LOGD("beken_strip", "Setting LED strip RGB order to %s", rgb_order);

            id(beken_strip_out).set_rgb_order(rgb_order);

  - id: white_mode_select
    name: "Choose W/RGB/W mode"
    platform: template
    entity_category: config
    restore_value: true
    options:
      - "RGB"
      - "RGBW"
      - "WRGB"
    initial_option: "RGB"
    set_action:
      then:
        - lambda: |-
            auto strip = id(beken_strip_out);
            if (x == "RGB") {
              ESP_LOGD("beken_strip", "Setting strip white mode to RGB");
              strip->set_is_rgbw(false);
              strip->set_is_wrgb(false);
            }

            if (x == "RGBW") {
              ESP_LOGD("beken_strip", "Setting strip white mode to RGBW");
              strip->set_is_rgbw(true);
              strip->set_is_wrgb(false);
            }

            if (x == "WRGB") {
              ESP_LOGD("beken_strip", "Setting strip white mode to WRGB");
              strip->set_is_rgbw(false);
              strip->set_is_wrgb(true);
            }

  - id: chipset_select
    name: "Choose LED chip"
    platform: template
    entity_category: config
    restore_value: true
    options:
      - "WS2812"
      - "SK6812"
      - "APA106"
      - "SM16703"
    initial_option: "WS2812"
    set_action:
      then:
        - lambda: |-
            auto bit0 = 224;
            auto bit1 = 252;
            auto spi_frequency = 6666666;
            // WS2812:  0b11100000, 0b11111100, 6666666
            // SK6812:  0b11000000, 0b11111000, 7500000
            // APA106:  0b11000000, 0b11111110, 5454545
            // SM16703: 0b11000000, 0b11111110, 7500000

            if(x == "WS2812") { 
              bit0 = 224;
              bit1 = 252;
              spi_frequency = 6666666;
            }

            if(x == "SK6812") { 
              bit0 = 192;
              bit1 = 248;
              spi_frequency = 7500000;
            }

            if(x == "APA106") { 
              bit0 = 192;
              bit1 = 254;
              spi_frequency = 5454545;
            }

            if(x == "SM16703") { 
              bit0 = 192;
              bit1 = 254;
              spi_frequency = 7500000;
            }

            ESP_LOGD("beken_strip", "Setting chip to %s, values %d %d %d", x, bit0, bit1, spi_frequency);

            id(beken_strip_out).set_led_params(bit0, bit1, spi_frequency);

number:
  - id: num_leds
    name: "Number of LEDs"
    platform: template
    entity_category: config
    mode: slider
    min_value: 1
    max_value: 255
    step: 1
    lambda: !lambda |-
      auto size = id(beken_strip_out).size();
      ESP_LOGD("beken_strip", "Retrieved strip size %d", size);
      return size;
    set_action:
      then:
        - lambda: |-
            ESP_LOGD("beken_strip", "Setting strip size to %d", x);
            id(beken_strip_out).set_num_leds(x);

button:
  - platform: template
    name: "Dump config"
    on_press:
      - lambda: |-
          id(beken_strip_out).dump_config();

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.1.61
    gateway: 10.0.0.1
    subnet: 255.255.254.0
  power_save_mode: none